data:
  patch_size: 16
  tubelet_size: 2
  crop_size: 256

model:
  compile_model: true
  use_activation_checkpointing: false
  activation_memory_budget: 0.5       # only used when compile_model = True and use_activation_checkpointing = False
  n_channels: 1                       # number of image channels. If > 1, the volumes obtained by the KneeNo dataset are repeated n_channels times
                                      # Set to 3 when loading the official pretrained checkpoint
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  lambda_progressive: true
  lambda_warmup_start_iter: 7500
  lambda_warmup_end_iter: 15000
  qk_norm: rms                    # one of "none", "layer", "rms"
                                   # must be "none" when loading the official pretrained checkpoint
  qk_norm_affine: false            # must match the checkpoint: false for runs trained with qk_norm_affine: false
  qk_temperature_max: 4.0        # must match the checkpoint: e.g. 4.0 for runs trained with a QK temperature
  local_window:
  - -1
  - -1
  - -1
  modality_embedding: true
  model_name: vit_base
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_causal: false
  pred_local_window:
  - -1
  - -1
  - -1
  pred_num_heads: 12
  uniform_power: true
  use_mask_tokens: true
  use_rope: true
  vit_conv: false
  zero_init_mask_tokens: true

# KneeNo classification evaluation of the frozen (target) encoder: the standalone script runs every task with
# a non-null eval.freq.<task> > 0 once -- see KneeNo/kneeno/evaluation/config.py for every key. "linear" is
# left out (KneeNo's default freq is null): V-JEPA 2.1 has no cls token (VJepa21Adapter.has_cls_token = False)
eval:
  seed: 239
  encoder: target  # target (EMA) | online
  encoder_amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32
  head_amp_dtype: null  # trained heads' forward under autocast (CUDA only): bfloat16 | null (float32)
  # torch.compile the frozen encoder's forward (one graph per batch shape): faster (Curia-B: 1.5x), the features
  # differ by float rounding only.
  compile_encoder: true
  # torch.compile the attentive heads' forward (one graph per micro-batch shape): faster, the results
  # differ by float rounding only.
  compile_attentive_heads: true
  cache_features: true  # linear / linear_pool train on embeddings extracted once per evaluation instead of
                        # re-encoding every head epoch; k-NN always uses the shared pass. attentive_pool never caches.
  extraction_batch_size: 32  # exams -> at most 128 volumes per encoder forward (cache pass and re-encoding heads)
  split:  # train and val: one split of the split manifest (KneeNo data/make_split_manifest.py); the test sets are used whole
    manifest: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_split_manifest.json
    level: ${SPLIT_LEVEL}  # fraction of the internal global "train" split used for train + val; one run per (level, rep) to report
    rep: ${SPLIT_REP}  # which of the level's stratified draws (0 .. n_seeds - 1)
  training:
    monitor_metric: auroc  # val metric that picks each head's best epoch and lr, and k-NN's temperature
    early_stop_patience_global: 0  # head epochs without a val improvement before stopping; 0 = never stop early; overridable per task
    loss: BCE
  verbose: true  # log each task's start and every head epoch's val metrics
  data:
    # internal: global "train" (the heads' train/val) + "val" (the "internal" test set); external: global "test".
    # $TMP/kneeno_data/external comes from KneeNo's prepare_data.py --external-tar.
    data_root: {internal: $TMP/kneeno_data/internal, external: $TMP/kneeno_data/external}
    label_meta:
      internal: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_labeled.json
      external: /hpcwork/p0021834/workspace_roman/jonas/metadata/external_labeled.json
    test_sets: [internal, external]  # heads are trained once and scored on both
    series_depth: 24  # match the pretraining run's data.series_depth -- also the encoder's depth
    resample_mode: nearest
    num_workers: 31
    prefetch_factor: 2  # batches each worker loads ahead; worker RAM in flight ~ num_workers * prefetch_factor batches
    abort_on_io_error: true  # a broken exam is retried (5 s apart) and then raises; never replaced by another exam
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/vjepa/pretrain_2_1/<MODEL_DIR>/eval/post-training/level-${SPLIT_LEVEL}.rep-${SPLIT_REP}/tb
    per_label_dir: /hpcwork/va105917/vjepa/pretrain_2_1/<MODEL_DIR>/eval/post-training/level-${SPLIT_LEVEL}.rep-${SPLIT_REP}/eval_per_label
    tag_prefix: eval
  freq:
    knn: 1
    linear_pool: 1
    attentive_pool: 1
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: [0.01, 0.02, 0.05, 0.07, 0.1, 0.2, 0.5, 1.0]  # swept: each k uses its best val temperature
    pooling: avg
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
    chunk_size: 1024
  linear_pool:
    pooling: avg
    batchnorm: true
    max_epochs: 50
    batch_size: 64
    grad_accum_steps: 1  # must stay 1 with batchnorm: true
    lr: [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02]  # swept: the best on val is tested
    warmup_epochs: 10
    weight_decay: 0.0
  attentive_pool:
    q2l: false
    encoder_layers: 0
    decoder_layers: 1
    num_heads: 16
    mlp_ratio: 4.0
    qkv_bias: true
    complete_block: true
    max_epochs: 15
    early_stop_patience: 5  # overrides training.early_stop_patience_global (re-encoding head, no feature cache)
    batch_size: 64
    grad_accum_steps: 4  # memory only: the head trains on micro-batches of batch_size / grad_accum_steps = 16 exams
    lr: 0.0005
    warmup_epochs: 3
    weight_decay: 0.001

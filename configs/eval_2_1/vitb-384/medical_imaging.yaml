data:
  dataset_type: MIDataset
  data_root: $TMP/kneeno_data/unlabeled
  data_meta: /hpcwork/p0021834/workspace_roman/jonas/BigKneeTar/metadata_unlabeled.json
  series_depth: 24
  resample_mode: nearest  # only used when series_depth > 0: "nearest" or "interpolate"
  batch_size: 48
  crop_size: 256
  patch_size: 16
  tubelet_size: 2
  num_workers: 8
  persistent_workers: true
  pin_mem: true

model:
  compile_model: true
  use_activation_checkpointing: false
  activation_memory_budget: 0.5       # only used when compile_model = True and use_activation_checkpointing = False
  n_channels: 1                       # number of image channels. If > 1, the volumes obtained by the KneeNo dataset are repeated n_channels times
                                      # Set to 3 when loading the official pretrained checkpoint
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  lambda_progressive: true
  lambda_warmup_start_iter: 7500
  lambda_warmup_end_iter: 15000
  qk_norm: none                    # one of "none", "layer", "rms"
                                   # must be "none" when loading the official pretrained checkpoint
  local_window:
  - -1
  - -1
  - -1
  modality_embedding: true
  model_name: vit_base
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_causal: false
  pred_local_window:
  - -1
  - -1
  - -1
  pred_num_heads: 12
  uniform_power: true
  use_mask_tokens: true
  use_rope: true
  vit_conv: false
  zero_init_mask_tokens: true

# KneeNo classification evaluation, run on the frozen (target) encoder every
# eval.freq.<task> epochs -- see KneeNo/kneeno/evaluation/config.py for every
# key. "linear" is explicitly disabled below: V-JEPA 2.1 has no cls token
# (VJepa21Adapter.has_cls_token = False)
eval:
  seed: 239
  encoder: target  # target (EMA) | online
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool train on embeddings extracted once per evaluation instead of
                        # re-encoding every head epoch; k-NN always uses the shared pass. attentive_pool never caches.
  split:
    test_fraction: 0.2
  data:
    data_root: $TMP/kneeno_data/unlabeled
    label_meta: /hpcwork/p0021834/workspace_roman/jonas/BigKneeTar/metadata_labeled.json
    series_depth: 24  # match the series_depth above -- no resampling distribution shift
    resample_mode: nearest
    num_workers: 16
    subset: 1.0  # seeded subsample of the labeled series: float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/vjepa/pretrain_2_1/16.8.vitb.256px.24f/eval_tb
    per_label_dir: /hpcwork/va105917/vjepa/pretrain_2_1/16.8.vitb.256px.24f/eval_per_label
    tag_prefix: eval
  freq:
    knn: 1
    linear: null  # V-JEPA 2.1 has no cls token -- explicitly override the default's freq (omitting
                  # this key would leave the default "linear: 5" in place via the config merge)
    linear_pool: 1
    attentive_pool: 1
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg
    batch_size: 128
  linear_pool:
    pooling: avg
    epochs: 20
    batch_size: 128
    lr: 0.001
  attentive_pool:
    depth: 1
    num_heads: 12
    epochs: 20
    batch_size: 64
    lr: 0.0005
    warmup_epochs: 5

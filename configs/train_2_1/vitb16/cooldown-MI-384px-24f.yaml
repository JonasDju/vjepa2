app: vjepa_2_1
nodes: 16
tasks_per_node: 8
cpus_per_task: 16
mem_per_gpu: 220G
folder: /hpcwork/va105917/vjepa/cooldown_2_1/${SLURM_JOB_ID}.16p.24d.vitb.384px
data:
  dataset_type: MIDataset
  data_root: /dev/shm/kneeno_data/unlabeled
  data_meta: /hpcwork/p0021834/workspace_roman/jonas/BigKneeTar/metadata_unlabeled.json
  series_depth: 24
  resample_mode: nearest  # only used when series_depth > 0: "nearest" or "interpolate"
  batch_size: 24
  crop_size: 384
  patch_size: 16
  tubelet_size: 2
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  computing_gram_loss: false
  gram_HighRes: false
  gram_ckpt: None
  gram_loss_weight: 10.0
  loss_exp: 1.0
  predict_all: true
  shift_by_n: 0
  weight_distance_loss: false
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  random_truncation: true  # cut each sample's context/target indices to the batch minimum with a random subset
                           # instead of the first ones (false = upstream: always drops the last slices)
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  random_truncation: true
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  dtype: bfloat16
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 50
  seed: 239
  use_sdpa: true
model:
  compile_model: true
  use_activation_checkpointing: false
  activation_memory_budget: 0.5       # only used when compile_model = True and use_activation_checkpointing = False
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  lambda_progressive: false
  modality_embedding: true
  qk_norm: rms                    # one of "none", "layer", "rms"
  qk_norm_affine: false           # false: q/k norm without learnable gain (and without LayerNorm bias); true = old behaviour
  qk_temperature_max: 4.0         # learnable per-head temperature (init 1), clamped to <= this -> |logit| <= 4 * sqrt(head_dim);
                                  # needs qk_norm != none and qk_norm_affine: false. null = no temperature
  model_name: vit_base
  n_registers: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_causal: false
  pred_num_heads: 12
  uniform_power: true
  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  anneal_ckpt: /hpcwork/va105917/vjepa/pretrain_2_1/<MODEL_DIR>/latest.pth.tar
  ema:
  - 0.99925
  - 0.99925
  epochs: 40
  warmup: 0
  ipe: 300
  ipe_scale: 1.25
  weight_decay: 0.04
  final_weight_decay: 0.04
  lr: 0.00015
  start_lr: 0.00015
  final_lr: 2.5e-07
  is_anneal: true
  resume_anneal: true


eval:
  seed: 239
  encoder: target  # target (EMA) | online
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool train on embeddings extracted once per evaluation instead of
                        # re-encoding every head epoch; k-NN always uses the shared pass. attentive_pool never caches.
  split:
    test_fraction: 0.2
  data:
    data_root: /dev/shm/kneeno_data/unlabeled
    label_meta: /hpcwork/p0021834/workspace_roman/jonas/BigKneeTar/metadata_labeled.json
    series_depth: 24  # match the series_depth above -- no resampling distribution shift
    resample_mode: nearest
    num_workers: 16
    subset: 12500  # seeded subsample of the labeled EXAMS: float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/vjepa/cooldown_2_1/${SLURM_JOB_ID}.16p.24d.vitb.384px/eval/in-training/tb
    per_label_dir: /hpcwork/va105917/vjepa/cooldown_2_1/${SLURM_JOB_ID}.16p.24d.vitb.384px/eval/in-training/eval_per_label
    tag_prefix: eval
  freq:
    knn: 10
    linear: null  # V-JEPA 2.1 has no cls token -- explicitly override the default's freq (omitting
                  # this key would leave the default "linear: 5" in place via the config merge)
    linear_pool: 10
    attentive_pool: null # Takes too long (~2h on 50k samples) -> only run once training is finished
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
    batch_size: 32  # exams -> 128 volumes per encoder forward
  linear_pool:
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    epochs: 20
    batch_size: 32  # exams
    lr: 0.001
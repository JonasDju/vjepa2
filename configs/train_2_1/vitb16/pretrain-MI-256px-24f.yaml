app: vjepa_2_1
nodes: 8
tasks_per_node: 8
cpus_per_task: 8
mem_per_gpu: 220G
folder: /hpcwork/va105917/vjepa/pretrain_2_1/${SLURM_JOB_ID}.16p.24d.vitb.256px
data:
  dataset_type: MIDataset
  data_root: /dev/shm/kneeno_data/internal
  data_meta: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_unlabeled.json
  series_depth: 24
  resample_mode: nearest  # only used when series_depth > 0: "nearest" or "interpolate"
  batch_size: 48
  crop_size: 256
  patch_size: 16
  tubelet_size: 2
  num_workers: 8
  persistent_workers: true
  pin_mem: true
data_aug:
  random_horizontal_flip: true
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
  predict_all: true
  reg_coeff: 0.0
  shift_by_n: 0
  weight_distance_loss: true

mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  random_truncation: true  # cut each sample's context/target indices to the batch minimum with a random subset
                           # instead of the first ones (false = upstream: always drops the last slices)
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  random_truncation: true
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  dtype: bfloat16
  load_checkpoint: true
  read_checkpoint: null
  save_every_freq: 50
  seed: 239
  use_sdpa: true
model:
  compile_model: true
  use_activation_checkpointing: false
  activation_memory_budget: 0.5       # only used when compile_model = True and use_activation_checkpointing = False
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  lambda_progressive: true
  lambda_warmup_start_iter: 7500
  lambda_warmup_end_iter: 15000
  qk_norm: rms                    # one of "none", "layer", "rms"
  qk_norm_affine: false           # false: q/k norm without learnable gain (and without LayerNorm bias); true = old behaviour
  qk_temperature_max: 4.0         # learnable per-head temperature (init 1), clamped to <= this -> |logit| <= 4 * sqrt(head_dim);
                                  # needs qk_norm != none and qk_norm_affine: false. null = no temperature
  local_window:
  - -1
  - -1
  - -1
  modality_embedding: true
  model_name: vit_base
  n_registers: 0
  n_registers_predictor: 0
  normalize_predictor: false
  pred_depth: 12
  pred_embed_dim: 384
  pred_is_causal: false
  pred_local_window:
  - -1
  - -1
  - -1
  pred_num_heads: 12
  uniform_power: true
  use_mask_tokens: true
  use_rope: true
  vit_conv: false
  zero_init_mask_tokens: true
optimization:
  ema:
  - 0.99925
  - 0.99925
  epochs: 300
  warmup: 10
  ipe: 300
  ipe_scale: 1.25
  weight_decay: 0.04
  final_weight_decay: 0.04
  # Safe lr for global batch size 48: 1e-4 or 2e-4
  # Use sqrt scaling for multi GPU training
  start_lr: 0.000075
  final_lr: 0.00015
  lr: 0.00015
  gradient_clipping: 1.0          # max global L2 norm of the encoder + predictor gradients; null = no clipping
  betas:                          # AdamW (beta_1, beta_2); the old default was [0.9, 0.999]
  - 0.9
  - 0.95
  eps: 1.0e-8

# KneeNo classification evaluation, run on the frozen (target) encoder every
# eval.freq.<task> epochs -- see KneeNo/kneeno/evaluation/config.py for every
# key. "linear" is explicitly disabled below: V-JEPA 2.1 has no cls token
# (VJepa21Adapter.has_cls_token = False)
eval:
  seed: 239
  encoder: target  # target (EMA) | online
  amp_dtype: bfloat16  # frozen-encoder forward under autocast (CUDA only); null -> float32. Heads still train in float32.
  cache_features: true  # linear / linear_pool train on embeddings extracted once per evaluation instead of
                        # re-encoding every head epoch; k-NN always uses the shared pass. attentive_pool never caches.
  split:  # the internal global "train" split (pretrained on) is cut into train and val; the test sets are used whole
    val_fraction: 0.2  # heads are scored on val every head epoch (early stopping)
  training:
    early_stop_on: auroc  # val metric that picks each head's best epoch
    early_stop_patience: 5  # head epochs without a val improvement before stopping; 0 = never stop early
    loss: BCE
  verbose: true  # log each task's start and every head epoch's val metrics
  data:
    # internal: global "train" (the heads' train/val) + "val" (the "internal" test set, never pretrained on)
    data_root: {internal: /dev/shm/kneeno_data/internal}
    label_meta: {internal: /hpcwork/p0021834/workspace_roman/jonas/metadata/internal_labeled.json}
    test_sets: [internal]  # in-training: never external (that is for the final numbers, not for picking checkpoints)
    series_depth: 24  # match the series_depth above -- no resampling distribution shift
    resample_mode: nearest
    num_workers: 16
    subset: 12500  # seeded subsample of the internal "train" EXAMS (test sets always whole): float in (0, 1] = fraction, int > 1 = count, 1.0 = all
    abort_on_io_error: false  # a broken exam is replaced by a random other one of its part (a val exam may become a train exam) instead of killing the run
    multiprocessing_context: fork  # eval DataLoader worker start method; null -> inherit. Workers must never touch CUDA
    persistent_workers: true  # keep workers alive across head epochs (ignored when num_workers = 0)
  logging:
    tensorboard_dir: /hpcwork/va105917/vjepa/pretrain_2_1/${SLURM_JOB_ID}.16p.24d.vitb.256px/eval/in-training/tb
    per_label_dir: /hpcwork/va105917/vjepa/pretrain_2_1/${SLURM_JOB_ID}.16p.24d.vitb.256px/eval/in-training/eval_per_label
    tag_prefix: eval
  freq:
    knn: 10
    linear_pool: 10
  knn:
    k: [5, 20, 50, 100]
    metric: cosine
    temperature: 0.07
    pooling: avg
    center: true  # subtract each sequence's mean feature before the per-sequence L2 normalisation
    batch_size: 32  # exams -> 128 volumes per encoder forward
    chunk_size: 1024
  linear_pool:
    pooling: avg
    batchnorm: true  # non-affine BatchNorm1d (z-score) in front of the linear layer
    max_epochs: 30
    batch_size: 64  # exams
    lr: 0.0015
    warmup_epochs: 5
    weight_decay: 0.0
